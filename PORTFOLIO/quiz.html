<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Game | Samantha Ongue</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #f8f6f0;
      --bg-card: #ffffff;
      --text-main: #1e1b18;
      --text-muted: #78716c;
      --border-subtle: #e7e2d9;
      --accent-dark: #2c2520;
      --accent-hover: #453c35;
      --correct-bg: #eaf5ec;
      --correct-border: #48a05c;
      --correct-text: #1b632c;
      --wrong-bg: #fdeeee;
      --wrong-border: #d9534f;
      --wrong-text: #962220;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .top-nav {
      width: 100%;
      max-width: 480px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--text-main);
    }

    .app-tag {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .quiz-card {
      background: var(--bg-card);
      width: 100%;
      max-width: 480px;
      border-radius: var(--radius);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 16px 36px rgba(30, 27, 24, 0.06), 0 2px 6px rgba(30, 27, 24, 0.03);
      padding: 32px 28px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .progress-bar-track {
      width: 100%;
      height: 6px;
      background-color: #f0eae1;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent-dark);
      transition: width 0.3s ease;
    }

    .question-title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 20px;
      color: var(--text-main);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      text-align: left;
      padding: 14px 18px;
      background: #faf8f5;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .option-btn:hover:not(:disabled) {
      background: #f2ece3;
      border-color: #d8cebf;
      transform: translateY(-1px);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
      font-weight: 600;
    }

    .option-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
      font-weight: 600;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 48px;
    }

    .feedback-message {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .feedback-message.correct {
      color: var(--correct-text);
    }

    .feedback-message.wrong {
      color: var(--wrong-text);
    }

    .btn-action {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 10px 20px;
      background: var(--accent-dark);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.2s ease;
      margin-left: auto;
    }

    .btn-action:hover {
      background: var(--accent-hover);
    }

    /* Score completion card */
    .completion-view {
      text-align: center;
      padding: 16px 0;
    }

    .completion-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .completion-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .score-badge {
      display: inline-block;
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text-main);
      background: #faf8f5;
      padding: 16px 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="samanthaONGUE.html" class="back-link">&larr; Back to Portfolio</a>
    <div style="display:flex; align-items:center; gap:8px;">
      <img src="logo.svg" alt="Samantha Ongue Logo" style="height:24px; width:auto;" />
      <span class="app-tag">Interactive Quiz</span>
    </div>
  </div>

  <div class="quiz-card" id="quiz-card">
    <div id="quiz-screen">
      <div class="progress-header">
        <span id="question-counter">Question 1 of 5</span>
        <span id="current-score">Score: 0</span>
      </div>

      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>

      <h2 class="question-title" id="question-text">Question text</h2>

      <div class="options-list" id="options-container">
        <!-- Option buttons dynamically generated -->
      </div>

      <div class="card-footer">
        <div class="feedback-message" id="feedback-text"></div>
        <button class="btn-action" id="next-btn" style="display:none;" onclick="handleNextQuestion()">Next Question</button>
      </div>
    </div>

    <div id="completion-screen" class="completion-view" style="display:none;">
      <h2 class="completion-title">Quiz Completed</h2>
      <p class="completion-desc" id="completion-desc">Here is how you scored on the front-end quiz.</p>
      
      <div class="score-badge" id="final-score-display">0 / 5</div>
      
      <div>
        <button class="btn-action" onclick="restartQuiz()">Restart Quiz</button>
      </div>
    </div>
  </div>

  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    window.scrollTo(0, 0);

    const questions = [
      {
        question: "Which HTML tag is used to write or import internal CSS stylesheets?",
        options: ["<script>", "<style>", "<css>", "<stylesheet>"],
        answer: "<style>"
      },
      {
        question: "Which CSS layout module is specifically designed for two-dimensional grid layouts?",
        options: ["Flexbox", "CSS Grid", "Float", "Inline-Block"],
        answer: "CSS Grid"
      },
      {
        question: "What does DOM stand for in JavaScript web development?",
        options: [
          "Document Object Model",
          "Digital Operation Method",
          "Data Object Manager",
          "Desktop Oriented Markup"
        ],
        answer: "Document Object Model"
      },
      {
        question: "Which JavaScript array method adds one or more items to the end of an array?",
        options: ["shift()", "unshift()", "push()", "pop()"],
        answer: "push()"
      },
      {
        question: "What is the default display value of a standard <div> element in HTML?",
        options: ["inline", "block", "inline-block", "flex"],
        answer: "block"
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    const questionCounter = document.getElementById('question-counter');
    const currentScoreDisplay = document.getElementById('current-score');
    const progressBar = document.getElementById('progress-bar');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedbackText = document.getElementById('feedback-text');
    const nextBtn = document.getElementById('next-btn');

    const quizScreen = document.getElementById('quiz-screen');
    const completionScreen = document.getElementById('completion-screen');
    const finalScoreDisplay = document.getElementById('final-score-display');
    const completionDesc = document.getElementById('completion-desc');

    function renderQuestion() {
      answered = false;
      const total = questions.length;
      const q = questions[currentQuestionIndex];

      questionCounter.textContent = `Question ${currentQuestionIndex + 1} of ${total}`;
      currentScoreDisplay.textContent = `Score: ${score}`;
      progressBar.style.width = `${((currentQuestionIndex) / total) * 100}%`;

      questionText.textContent = q.question;
      optionsContainer.innerHTML = '';
      feedbackText.textContent = '';
      feedbackText.className = 'feedback-message';
      nextBtn.style.display = 'none';

      q.options.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = option;
        btn.addEventListener('click', () => selectAnswer(option, btn));
        optionsContainer.appendChild(btn);
      });
    }

    function selectAnswer(selected, chosenBtn) {
      if (answered) return;
      answered = true;

      const q = questions[currentQuestionIndex];
      const correct = q.answer;
      const buttons = optionsContainer.querySelectorAll('.option-btn');

      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === correct) {
          btn.classList.add('correct');
        }
      });

      if (selected === correct) {
        score++;
        feedbackText.textContent = 'Correct answer!';
        feedbackText.classList.add('correct');
      } else {
        chosenBtn.classList.add('wrong');
        feedbackText.textContent = `Incorrect. Correct answer: ${correct}`;
        feedbackText.classList.add('wrong');
      }

      currentScoreDisplay.textContent = `Score: ${score}`;

      if (currentQuestionIndex === questions.length - 1) {
        nextBtn.textContent = 'View Results';
      } else {
        nextBtn.textContent = 'Next Question';
      }
      nextBtn.style.display = 'block';
    }

    function handleNextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      progressBar.style.width = '100%';
      quizScreen.style.display = 'none';
      completionScreen.style.display = 'block';
      finalScoreDisplay.textContent = `${score} / ${questions.length}`;

      if (score === questions.length) {
        completionDesc.textContent = 'Perfect score! Great job on all front-end questions.';
      } else if (score >= 3) {
        completionDesc.textContent = 'Good effort! You answered most questions correctly.';
      } else {
        completionDesc.textContent = 'Quiz finished. Try again to improve your score!';
      }
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      quizScreen.style.display = 'block';
      completionScreen.style.display = 'none';
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html
